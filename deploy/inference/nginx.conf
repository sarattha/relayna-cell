worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 10s;
  limit_conn_zone $server_name zone=inference:1m;
  # Docker DNS is re-resolved if Ollama is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    server_name cell-inference;
    set $ollama http://ollama:11434;
    location = /healthz { return 200 "ok\n"; }
    location = /v1/chat/completions {
      limit_except POST { deny all; }
      limit_conn inference 4;
      proxy_pass $ollama;
      proxy_set_header Host ollama:11434;
      proxy_set_header Authorization "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 120s;
      proxy_send_timeout 10s;
      proxy_buffering off;
    }
    # Workloads may infer, but may not pull/delete models or change Ollama.
    location / { return 403; }
  }
}
