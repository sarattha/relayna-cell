name: relayna-cell-observability
services:
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    networks: [logging]
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: "4m", max-file: "2"}
  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/relayna-cell/logs:/var/log/relayna-cell:ro
      - alloy-data:/var/lib/alloy
    networks: [logging]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: "4m", max-file: "2"}
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3300
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [logging]
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: "4m", max-file: "2"}
networks:
  logging:
    driver: bridge
volumes:
  loki-data:
  alloy-data:
  grafana-data:
