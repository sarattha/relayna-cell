name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test
      - run: make build build-linux
      - run: python3 scripts/build-dashboards.py --check
      - run: python3 scripts/test-linux-setup.py
      - run: bash -n scripts/setup-linux.sh scripts/network-guard.sh
      - run: docker compose -f deploy/observability/compose.yaml config --quiet
      - run: docker compose -f deploy/inference/compose.yaml config --quiet
